<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Mermaid Array Diagram Demo</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=" />
    <style>
      div.mermaid {
        font-family: 'Courier New', Courier, monospace !important;
      }
    </style>
  </head>

  <body>
    <h1>Array Diagram Demo</h1>

    <div>
      <textarea id="arrayInput" rows="10" cols="50">
visual
size: (600,400)
page
layout: (2,2)
array
position: (0,0)
@
1 {color:"blue", arrow:"null"}
2 {color:"green", arrow:"null"}
3 {color:"red", arrow:"null"}
@
text
position: previous
placement: below
"This is below the array"
text
position: previous
placement: above
"This is above the array"
graph
position: (1,0)
@
node:A {value:"A", color:"lightblue", arrow:"null", hidden:"null"}
node:B {value:"B", color:"lightgreen", arrow:"null", hidden:"null"}
edge:(A,B)
@
text
position: previous
placement: right
"Right of graph"
matrix
position: (1,1)
@
1,2,3
4,5,6
@
text
position: previous
placement: left
"Left of matrix"
neural-network
position: (0,1)
@
firstlayer v1 v1 v2
firstlayer v3 v4 f1
@</textarea
      >
      <br />
      <button id="renderButton">Render Diagram</button>
    </div>

    <div class="diagrams">
      <div id="mermaidDiagram" class="mermaid"></div>
    </div>

    <script type="module">
      import mermaid from '/mermaid.esm.mjs';

      async function renderDiagram() {
        const input = document.getElementById('arrayInput').value;
        const { svg } = await mermaid.render('dynamicDiagram', input);
        document.getElementById('mermaidDiagram').innerHTML = svg;
      }

      document.getElementById('renderButton').addEventListener('click', async () => {
        await renderDiagram();
      });

      window.onload = async () => {
        await renderDiagram();
      };

      mermaid.initialize({
        startOnLoad: true,
        logLevel: 3,
        securityLevel: 'loose',
      });
    </script>

    <style>
      .diagrams {
        display: flex;
        flex-wrap: wrap;
      }
      #arrayInput {
        width: 50vw;
        padding: 1em;
      }
      #mermaidDiagram {
        width: 45vw;
        padding: 2em;
      }
    </style>
  </body>
</html>
